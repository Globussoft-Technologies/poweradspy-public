<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PowerAdSpy</title>

    <!-- PWA: installable app. The manifest/apple tags only matter to the
         browser's install flow and the installed app; theme-color and
         viewport-fit are added by the script below for standalone launches
         only, so the website in a normal browser tab is unchanged. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PowerAdSpy" />
    <script>
      // Installed phone app → `pwa-mobile` class on <html>, before first paint
      // (no flash of the website layout). Standalone via display-mode (Chrome,
      // Edge, Samsung Internet, Opera, newer iOS) or navigator.standalone (iOS
      // Safari). KEEP IN SYNC with isInstalledMobileNow in hooks/useInstalledMobile.js.
      (function markInstalledMobile() {
        var mq = function (q) { return !!(window.matchMedia && window.matchMedia(q).matches); };
        var standalone = mq('(display-mode: standalone)') || window.navigator.standalone === true;
        var phone = window.matchMedia ? mq('(max-width: 767px)') : window.innerWidth < 768;
        if (standalone && phone) document.documentElement.classList.add('pwa-mobile');
        if (standalone) {
          // Installed app only: draw under the notch (safe-area padding handles
          // it) and tint the status bar; useTheme keeps the colour in sync.
          var vp = document.querySelector('meta[name="viewport"]');
          if (vp) vp.setAttribute('content', vp.getAttribute('content') + ', viewport-fit=cover');
          var tc = document.createElement('meta');
          tc.name = 'theme-color';
          tc.content = '#ffffff';
          document.head.appendChild(tc);
        }
      })();
    </script>

    <!-- Google tag (gtag.js), loaded only for the configured rollout environment. -->
    <script>
      (function initializeGoogleAnalytics() {
        const rollout = '%GOOGLE_GA4_ENABLED%'.trim().toLowerCase();
        const hostname = window.location.hostname.toLowerCase();
        const isLocal = ['localhost', '127.0.0.1', '::1'].includes(hostname);
        const isDevelopment = !isLocal && ['dev', 'staging', 'test', 'qa']
          .some((marker) => hostname.includes(marker));
        const runtimeEnvironment = isLocal ? 'local' : (isDevelopment ? 'dev' : 'prod');
        // "prod" enables GA4 everywhere, including the production hostname.
        const enabled = rollout === 'prod'
          || (rollout === 'dev' && runtimeEnvironment !== 'prod')
          || (rollout === 'local' && runtimeEnvironment === 'local');

        window.__POWERADSPY_GA4_ENABLED__ = enabled;
        if (!enabled) return;

        const tagId = '%GOOGLE_TAG_ID%'.trim();
        if (!tagId) return;

        window.dataLayer = window.dataLayer || [];
        window.gtag = function gtag(){window.dataLayer.push(arguments);};
        window.gtag('js', new Date());
        // send_page_view: false — this is a single-page app, so the raw
        // browser URL at script-load time can contain a dynamic ID
        // (e.g. /pinterest/07184...). Page views are sent explicitly via
        // trackAnalyticsPageView() with a clean, ID-free path instead.
        window.gtag('config', tagId, { send_page_view: false });

        const script = document.createElement('script');
        script.async = true;
        script.src = `https://www.googletagmanager.com/gtag/js?id=${encodeURIComponent(tagId)}`;
        document.head.appendChild(script);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Google Translate Widget (hidden — triggered programmatically via Globe button) -->
    <div id="google_translate_element" style="display:none"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          { pageLanguage: 'en', includedLanguages: 'ar,fr,pt', autoDisplay: false },
          'google_translate_element'
        );
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </body>
</html>
